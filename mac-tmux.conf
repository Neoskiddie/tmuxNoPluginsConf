set-option -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -g history-limit 20000 # boost history

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

bind -T copy-mode-vi y send-keys -X copy-pipe 'pbcopy'

# open panes in current directory
# Without this it was always annoying
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# enable mouse support - splitting etc
set -g mouse on

# update things every second - used for example with time for displaying seconds
set -g status-interval 1

# change the colour of the main tmux bar
set-option -g status-style fg=colour6,bg=colour235
set -g pane-border-style fg=#2596be
set -g pane-active-border-style fg=#9AD0C2

set-option -g status-justify centre
set-option -g status-left-length 50
set-option -g status-left-style default
set -g status-right-length 140

# left part of status bar with hostname and distro
set-option -g status-left "#[fg=green]#H #[fg=black]• #[fg=green,bright]#(uname)#[default]"

set -g status-right "#[fg=red,bg=orange]#{?pane_in_mode,[------COPY MODE------],}"

set -ag status-right "#[default] | #(top -bn2 | grep 'Cpu(s)' | tail -n 1 | sed 's/.*, *\\([0-9.]*\\)%* id.*/\\1/' | awk '{printf(\"CPU%5.2f%%\", 100 - $1)}')"

# stop annoying jump to bottom after copy
# it also solves the problem with mouse copping where you need to keep pressing the mouse button
unbind -T copy-mode-vi MouseDragEnd1Pane

#Trying to make selected panel to stand out more:
#set -g pane-active-border-style fg=red
set -g pane-active-border-style 'fg=red,bg=colour52'
set -g window-active-style 'bg=colour232'

set -ag status-right "#[fg=white,bg=default]%H:%M:%S#[default] #[fg=green] %a %Y-%m-%d"
set -g allow-passthrough on

